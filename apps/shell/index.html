<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>知识图谱平台 · Shell</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      /* 壳层导航：固定高度，不参与子应用空间（颜色取平台主题 token） */
      #shell-nav {
        flex: none;
        display: flex;
        gap: 12px;
        padding: 8px 16px;
        background: rgb(var(--surface));
        color: rgb(var(--foreground));
        border-bottom: 1px solid rgb(var(--border) / 0.6);
        align-items: center;
      }
      #shell-nav a {
        color: rgb(var(--muted-foreground));
        text-decoration: none;
        font-size: 14px;
      }
      #shell-nav a.active {
        color: rgb(var(--overlay-bg));
      }
      /* 当前用户芯片（右上角，点击进个人中心 /user） */
      #shell-user {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 999px;
        border: 1px solid rgb(var(--border) / 0.7);
        background: rgb(var(--background) / 0.5);
        color: rgb(var(--foreground));
        font-size: 13px;
        text-decoration: none;
      }
      #shell-user::before {
        content: "👤";
        font-size: 12px;
      }
      #shell-user:hover {
        border-color: rgb(var(--overlay-bg));
      }
      #shell-user[hidden] {
        display: none;
      }
      /* 子应用占剩余空间；作为其绝对定位工具栏的参照系 */
      #shell-main {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      #single-spa-application\:graph-app,
      #single-spa-application\:import-app,
      #single-spa-application\:user-app {
        position: absolute;
        inset: 0;
        /* 空容器不拦截鼠标事件（否则未挂载的空容器叠在上面会吃掉点击）；
           仅当有内容（已挂载）时恢复可交互 */
        pointer-events: none;
      }
      #single-spa-application\:graph-app:not(:empty),
      #single-spa-application\:import-app:not(:empty),
      #single-spa-application\:user-app:not(:empty) {
        pointer-events: auto;
        animation: appIn 200ms var(--ease-out) both; /* 挂载后淡入，掩盖切换空窗 */
      }
      @keyframes appIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      /* 壳层导航：退出登录（跟随右侧用户芯片，不再独占 auto） */
      #logout-btn {
        padding: 4px 10px;
        border: 1px solid rgb(var(--border) / 0.8);
        border-radius: 6px;
        background: transparent;
        color: rgb(var(--muted-foreground));
        font-size: 13px;
        cursor: pointer;
      }
      #logout-btn:hover {
        border-color: rgb(var(--danger));
        color: rgb(var(--danger));
      }
      /* 壳层页面视图：与子应用容器同处 #shell-main；空态不拦截点击 */
      view-container {
        position: absolute;
        inset: 0;
        overflow: auto;
        padding: 24px;
        pointer-events: none;
      }
      view-container:not(:empty) {
        pointer-events: auto;
      }
      /* 壳层视图切换：新视图淡入；.view-leave 由 view-container 播放淡出 */
      view-container > * {
        animation: viewIn 200ms var(--ease-out) both;
      }
      view-container > .view-leave {
        animation: viewOut 120ms var(--ease-out) both;
      }
      @keyframes viewIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes viewOut {
        from {
          opacity: 1;
          transform: none;
        }
        to {
          opacity: 0;
          transform: translateY(-4px);
        }
      }
      /* 减弱动效：保留 opacity 淡入，去除位移 */
      @media (prefers-reduced-motion: reduce) {
        view-container > *,
        #single-spa-application\:graph-app:not(:empty),
        #single-spa-application\:import-app:not(:empty),
        #single-spa-application\:user-app:not(:empty) {
          animation: fadeInOnly 200ms ease-out both;
        }
      }
      @keyframes fadeInOnly {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <nav id="shell-nav">
      <strong>KG 平台</strong>
      <a href="/graph" data-route="/graph">图谱</a>
      <a href="/import" data-route="/import">数据导入</a>
      <a href="/" data-route="/">首页</a>
      <a href="/user" data-route="/user" id="shell-user" hidden></a>
      <button id="logout-btn" type="button" title="退出登录">退出</button>
    </nav>
    <main id="shell-main">
      <!-- single-spa 子应用挂载容器 -->
      <div id="single-spa-application:graph-app"></div>
      <div id="single-spa-application:import-app"></div>
      <div id="single-spa-application:user-app"></div>
      <!-- 壳层页面（首页 / 404）挂载容器 -->
      <view-container></view-container>
    </main>

    <login-view hidden></login-view>

    <script>
      ;(function () {
        function applyImportMap(map) {
          var s = document.createElement("script")
          s.type = "importmap"
          s.textContent = JSON.stringify(map)
          document.head.appendChild(s)
        }
        var xhr = new XMLHttpRequest()
        xhr.open("GET", "./importmap.json", false)
        try {
          xhr.send()
          applyImportMap(JSON.parse(xhr.responseText))
        } catch (e) {
          console.warn("[shell] importmap 加载失败，使用静态兜底", e)
          applyImportMap({
            imports: {
              react: "./shared/react@18.3.1.js",
              "react/jsx-runtime": "./shared/react@18.3.1-jsx-runtime.js",
              "react-dom": "./shared/react-dom@18.3.1.js",
              "react-dom/client": "./shared/react-dom@18.3.1-client.js",
              scheduler: "./shared/scheduler@0.23.2.js",
              "graph-app": "./subapps/graph-app@0.4.0.js",
              "import-app": "./subapps/import-app@0.2.0.js",
              "user-app": "./subapps/user-app@0.2.0.js",
            },
          })
        }
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
