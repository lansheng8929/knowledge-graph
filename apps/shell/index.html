<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>知识图谱平台 · Shell</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      /* 壳层导航：固定高度，不参与子应用空间（颜色取平台主题 token） */
      #shell-nav {
        flex: none;
        display: flex;
        gap: 12px;
        padding: 8px 16px;
        background: rgb(var(--surface));
        color: rgb(var(--foreground));
        border-bottom: 1px solid rgb(var(--border) / 0.6);
        align-items: center;
      }
      #shell-nav a {
        color: rgb(var(--muted-foreground));
        text-decoration: none;
        font-size: 14px;
      }
      #shell-nav a.active {
        color: rgb(var(--overlay-bg));
      }
      /* 当前用户芯片（右上角，点击进个人中心 /user） */
      #shell-user {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 999px;
        border: 1px solid rgb(var(--border) / 0.7);
        background: rgb(var(--background) / 0.5);
        color: rgb(var(--foreground));
        font-size: 13px;
        text-decoration: none;
      }
      #shell-user::before {
        content: "👤";
        font-size: 12px;
      }
      #shell-user:hover {
        border-color: rgb(var(--overlay-bg));
      }
      #shell-user[hidden] {
        display: none;
      }
      /* 子应用占剩余空间；作为其绝对定位工具栏的参照系 */
      #shell-main {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      #single-spa-application\:graph-app,
      #single-spa-application\:import-app,
      #single-spa-application\:user-app {
        position: absolute;
        inset: 0;
        /* 空容器不拦截鼠标事件（否则未挂载的空容器叠在上面会吃掉点击）；
           仅当有内容（已挂载）时恢复可交互 */
        pointer-events: none;
      }
      #single-spa-application\:graph-app:not(:empty),
      #single-spa-application\:import-app:not(:empty),
      #single-spa-application\:user-app:not(:empty) {
        pointer-events: auto;
      }
      /* ── 登录界面（T2.3.3 生产鉴权，颜色取主题 token）── */
      #login-view {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          circle at 30% 20%,
          rgb(var(--surface)),
          rgb(var(--background)) 70%
        );
      }
      #login-view[hidden] {
        display: none;
      }
      .login-card {
        width: 320px;
        padding: 32px 28px;
        border-radius: 12px;
        background: rgb(var(--surface));
        border: 1px solid rgb(var(--border) / 0.7);
        box-shadow: 0 20px 60px rgb(0 0 0 / 0.5);
        color: rgb(var(--foreground));
      }
      .login-card h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      .login-card p.sub {
        margin: 0 0 20px;
        font-size: 13px;
        color: rgb(var(--muted-foreground));
      }
      .login-card label {
        display: block;
        font-size: 13px;
        color: rgb(var(--muted-foreground));
        margin: 12px 0 4px;
      }
      .login-card input {
        box-sizing: border-box;
        width: 100%;
        padding: 9px 10px;
        border-radius: 6px;
        border: 1px solid rgb(var(--border) / 0.8);
        background: rgb(var(--background));
        color: rgb(var(--foreground));
        font-size: 14px;
        outline: none;
      }
      .login-card input:focus {
        border-color: rgb(var(--overlay-bg));
      }
      .login-card button {
        width: 100%;
        margin-top: 20px;
        padding: 10px;
        border: none;
        border-radius: 6px;
        background: rgb(var(--primary));
        color: rgb(var(--primary-foreground));
        font-size: 14px;
        cursor: pointer;
      }
      .login-card button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .login-error {
        min-height: 18px;
        margin-top: 10px;
        font-size: 13px;
        color: rgb(var(--danger));
      }
      /* 壳层导航：退出登录（跟随右侧用户芯片，不再独占 auto） */
      #logout-btn {
        padding: 4px 10px;
        border: 1px solid rgb(var(--border) / 0.8);
        border-radius: 6px;
        background: transparent;
        color: rgb(var(--muted-foreground));
        font-size: 13px;
        cursor: pointer;
      }
      #logout-btn:hover {
        border-color: rgb(var(--danger));
        color: rgb(var(--danger));
      }
    </style>
  </head>
  <body>
    <nav id="shell-nav">
      <strong>KG 平台</strong>
      <a href="/graph" data-route="/graph">图谱</a>
      <a href="/import" data-route="/import">数据导入</a>
      <a href="/" data-route="/">首页</a>
      <a href="/user" data-route="/user" id="shell-user" hidden></a>
      <button id="logout-btn" type="button" title="退出登录">退出</button>
    </nav>
    <main id="shell-main">
      <!-- single-spa 子应用挂载容器 -->
      <div id="single-spa-application:graph-app"></div>
      <div id="single-spa-application:import-app"></div>
      <div id="single-spa-application:user-app"></div>
    </main>
    <!-- T2.3.3 登录界面（生产鉴权）：启动前必须登录换取 JWT -->
    <div id="login-view" hidden>
      <form class="login-card" id="login-form">
        <h1>知识图谱平台</h1>
        <p class="sub">请使用平台账号登录</p>
        <label for="login-username">用户名</label>
        <input
          id="login-username"
          name="username"
          autocomplete="username"
          required
        />
        <label for="login-password">密码</label>
        <input
          id="login-password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
        <button id="login-submit" type="submit">登 录</button>
        <div class="login-error" id="login-error" role="alert"></div>
      </form>
    </div>
    <!-- T2.3.4 动态 importmap：由 importmap.json 决定加载哪个子应用版本。
         更新/回滚子应用 = 只改 importmap.json（部署态文件），shell 零重建零部署。 -->
    <script>
      // 在任何模块执行前同步拉取 importmap 并注入，保证 import("graph-app") 可解析。
      // （子应用产物由 bash scripts/publish-graph-app.sh 发布到 ./subapps/）
      ;(function () {
        function applyImportMap(map) {
          var s = document.createElement("script")
          s.type = "importmap"
          s.textContent = JSON.stringify(map)
          document.head.appendChild(s)
        }
        var xhr = new XMLHttpRequest()
        xhr.open("GET", "./importmap.json", false)
        try {
          xhr.send()
          applyImportMap(JSON.parse(xhr.responseText))
        } catch (e) {
          console.warn("[shell] importmap 加载失败，使用静态兜底", e)
          applyImportMap({
            imports: { "graph-app": "./subapps/graph-app@0.2.0.js" },
          })
        }
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
