# API Gateway（T2.2）—— Nginx
#
# 职责：
#   - 统一入口 :8080
#   - 路由：/api/v1/graph/* → graph-query-service:8001
#           /api/v1/rules/*  → graph-rule-service:8002
#   - 限流（L1 粗粒度防护）
#   - CORS 统一出口（替代各服务内 CORS）
#   - JWT 校验占位（Phase 4 接 IDP/OPA 后启用 auth_request）
#
# 说明：upstream 使用 docker 网络服务名；本地调试可改用 127.0.0.1:8001 等。

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream graph_query {
    server graph-query-service:8001;
}

upstream graph_rule {
    server graph-rule-service:8002;
}

# T4.1.1：auth-service（签发/校验 JWT）
upstream auth_service {
    server auth-service:8004;
}

# 数据导入模块：graph-ingestion（唯一写入口）+ file-import-service（解析编排）
upstream graph_ingestion {
    server graph-ingestion:8003;
}

upstream file_import {
    server file-import-service:8005;
}

server {
    listen 8080;
    server_name _;

    # ── CORS（统一出口）──────────────────────────────
    add_header Access-Control-Allow-Origin  "$http_origin" always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods  "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers  "Content-Type, Authorization, X-Requested-With" always;
    add_header Access-Control-Max-Age        3600 always;

    # 预检请求直接放行
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ── graph 流式端点（NDJSON 边查边发）：关缓冲，实时转发 ──
    # 正则 location 优先于下方前缀 location（非 ^~）；鉴权与普通 graph 一致。
    location ~ ^/api/v1/graph/(init|expand)/stream$ {
        limit_req zone=api_limit burst=20 nodelay;
        auth_request /_authz;
        auth_request_set $user_ctx $upstream_http_x_subject_context;
        proxy_set_header X-User-Context $user_ctx;
        proxy_pass http://graph_query;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 流式关键：不缓冲、不缓存、长超时（否则 nginx 攒整块才转发，失去流式意义）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ── /api/v1/graph/* → graph-query-service ────────
    location /api/v1/graph/ {
        limit_req zone=api_limit burst=20 nodelay;
        # T4.1.2：网关校验 JWT（auth-service）+ 注入主体上下文
        #   auth-service 校验通过后以响应头 X-Subject-Context 回传主体属性，
        #   此处 auth_request_set 取出并注入上游 X-User-Context（供 L2/L3/L4 使用）
        auth_request /_authz;
        auth_request_set $user_ctx $upstream_http_x_subject_context;
        proxy_set_header X-User-Context $user_ctx;
        proxy_pass http://graph_query;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── /api/v1/rules → graph-rule-service ──────────
    # 前缀匹配（无尾斜杠，兼容 GET /api/v1/rules 与 /api/v1/rules/{id}）
    location /api/v1/rules {
        limit_req zone=api_limit burst=20 nodelay;
        # T4.1.2：同样经 JWT 校验 + 注入主体
        auth_request /_authz;
        auth_request_set $user_ctx $upstream_http_x_subject_context;
        proxy_set_header X-User-Context $user_ctx;
        proxy_pass http://graph_rule;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── /api/v1/ingest/* → graph-ingestion（唯一写入口）─
    location /api/v1/ingest/ {
        limit_req zone=api_limit burst=20 nodelay;
        auth_request /_authz;
        auth_request_set $user_ctx $upstream_http_x_subject_context;
        proxy_set_header X-User-Context $user_ctx;
        proxy_pass http://graph_ingestion;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── /api/v1/import/* → file-import-service ────────
    location /api/v1/import/ {
        limit_req zone=api_limit burst=20 nodelay;
        auth_request /_authz;
        auth_request_set $user_ctx $upstream_http_x_subject_context;
        proxy_set_header X-User-Context $user_ctx;
        proxy_pass http://file_import;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── T4.1.1：登录/签发 token（无需鉴权）──────────
    location /api/v1/auth/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 健康检查经网关
    location = /healthz {
        proxy_pass http://graph_query;
        proxy_set_header Host              $host;
    }

    # ── T4.1.2：JWT 校验端点（auth-service，内部）──
    # 由 auth_request 调用；通过 → 200 + X-Subject-Context 头；401/403 直接回
    location = /_authz {
        internal;
        proxy_pass http://auth_service;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }

    location / {
        return 404;
    }
}
