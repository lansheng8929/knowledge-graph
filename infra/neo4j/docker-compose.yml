# Neo4j 独立部署（从 vite-test/ 迁移，2026-08-03）
#
# 保持与原 vite-test/docker-compose.yml 完全一致的命名，避免数据丢失：
#   - 顶层 name: vite-test → 网络自动为 vite-test_default、卷名自动为 vite-test_neo4j_data 等
#   - 容器名 knowledge-graph-neo4j 不变（infra/docker-compose.yml 经它访问）
# 因此现有数据卷、网络均被复用，可安全删除 vite-test/。
#
# 启动：
#   docker compose -f infra/neo4j/docker-compose.yml up -d
# 验证：
#   curl http://localhost:7474  （Neo4j Browser）
#   docker exec knowledge-graph-neo4j cypher-shell -u neo4j -p password123 "MATCH (n) RETURN count(n)"

name: vite-test

services:
  neo4j:
    image: neo4j:5-community
    container_name: knowledge-graph-neo4j
    ports:
      - "7687:7687" # Bolt
      - "7474:7474" # HTTP (Browser)
    environment:
      - NEO4J_AUTH=neo4j/password123
      # 堆内存（Neo4j 5.x 推荐配置名）
      - NEO4J_server_memory_heap_max__size=2G
      # 页面缓存
      - NEO4J_server_memory_pagecache_size=1.5G
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
