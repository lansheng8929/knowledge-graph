# docker-compose.dev.yml — 开发模式全容器（含热更新）
#
# 与生产（docker-compose.yml）同构，但：
#   - 后端容器挂载 app 源码 + uvicorn --reload → 改本地代码自动重载
#   - 前端容器挂载整个仓库 + vite dev --host → 改源码热更新（HMR）
#   - 数据源复用现有卷（vite-test_neo4j_data），与生产共用一套数据
#
# 启动：docker compose -f infra/docker-compose.dev.yml up -d --build
# 入口：http://localhost:3001/graph?user=analyst
# 注意：dev 与 prod 的 neo4j 共用数据卷，勿同时运行（up.sh 已自动切换）

name: kg-dev

services:
  # ── 数据源（复用现有 Neo4j 数据卷）──────────────────
  neo4j:
    image: neo4j:5-community
    container_name: kg-dev-neo4j
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1.5G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    ports:
      - "7687:7687"
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:latest
    container_name: kg-dev-opa
    command:
      [
        "run",
        "--server",
        "--addr=0.0.0.0:8181",
        "--log-level=info",
        "/policies",
      ]
    volumes:
      - ../policies:/policies:ro
    ports:
      - "8181:8181"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: kg-dev-postgres
    environment:
      POSTGRES_USER: kg
      POSTGRES_PASSWORD: kg
      POSTGRES_DB: kg
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kg -d kg"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ── 后端（挂载源码 + --reload 热更新）────────────────
  query:
    build:
      context: ../
      dockerfile: services/graph-query-service/Dockerfile
    container_name: kg-dev-query
    volumes:
      - ../services/graph-query-service/app:/app/app # 源码热更新
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8001
    environment:
      NEO4J_URI: bolt://kg-dev-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      RULE_SERVICE_URL: http://kg-dev-rule:8002
      ENABLE_PEP: "true"
      OPA_URL: http://kg-dev-opa:8181
      AUDIT_SINK: postgres
      AUDIT_DSN: postgresql://kg:kg@kg-dev-postgres:5432/kg
      # dev 直连 JWT 兜底（与 auth 同密钥）
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    restart: unless-stopped

  rule:
    build:
      context: ../
      dockerfile: services/graph-rule-service/Dockerfile
    container_name: kg-dev-rule
    volumes:
      - ../services/graph-rule-service/app:/app/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8002
    environment:
      RULE_STORE: postgres
      PG_DSN: postgresql://kg:kg@kg-dev-postgres:5432/kg
      ENABLE_PEP: "true"
      OPA_URL: http://kg-dev-opa:8181
      AUDIT_SINK: postgres
      AUDIT_DSN: postgresql://kg:kg@kg-dev-postgres:5432/kg
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8002"
    restart: unless-stopped

  auth:
    build:
      # context 为仓库根：Dockerfile 需 COPY shared/service-common（JWT 统一实现）
      context: ../
      dockerfile: services/auth-service/Dockerfile
    container_name: kg-dev-auth
    volumes:
      - ../services/auth-service/app:/app/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8004
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      USER_STORE: postgres
      AUTH_DB_DSN: postgresql://kg:kg@kg-dev-postgres:5432/kg
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # 初始管理员密码（仅 bootstrap；生产由 Secret 注入）
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8004:8004"
    restart: unless-stopped

  # ── 数据导入模块（T3.1 / import-module-plan P1）──────
  ingestion:
    build:
      context: ../
      dockerfile: services/graph-ingestion/Dockerfile
    container_name: kg-dev-ingestion
    volumes:
      - ../services/graph-ingestion/app:/app/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8003
    environment:
      NEO4J_URI: bolt://kg-dev-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      # 亲密度 v2 多维配置：类型权重 × 金额归一化（timeDecay/frequency 默认关）
      INTIMACY_CONFIG: '{"combine":"product","dimensions":{"linkTypeWeight":{"enabled":true,"weights":{"CALL":0.6,"TRANSFER":0.9,"OWNS":0.7},"defaultWeight":0.5},"businessMetric":{"enabled":true,"fields":[{"field":"amount","min":0,"max":100000}]},"timeDecay":{"enabled":false},"frequency":{"enabled":false}}}'
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
      - "8003:8003"
    restart: unless-stopped

  import:
    build:
      # context 为仓库根：Dockerfile 需 COPY shared/service-common（JWT 统一实现）
      context: ../
      dockerfile: services/file-import-service/Dockerfile
    container_name: kg-dev-import
    volumes:
      - ../services/file-import-service/app:/app/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8005
    environment:
      INGESTION_BASE_URL: http://kg-dev-ingestion:8003
      # 与 auth-service 同一密钥：dev 直连（无网关）时校验 Authorization JWT
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # 历史任务落库 Postgres（P2：重启不丢 / 多 worker 一致）
      TASK_STORE: postgres
      PG_DSN: postgresql://kg:kg@kg-dev-postgres:5432/kg
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8005:8005"
    restart: unless-stopped

  filter-config:
    build:
      context: ../
      dockerfile: services/filter-config-service/Dockerfile
    container_name: kg-dev-filter-config
    volumes:
      - ../services/filter-config-service/app:/app/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8007
    environment:
      # 与 auth-service 同一密钥（dev 直连 JWT 校验用）
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      # filter_schema 落 Postgres
      PG_DSN: postgresql://kg:kg@kg-dev-postgres:5432/kg
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8007:8007"
    restart: unless-stopped

  agent:
    build:
      # context 为仓库根：Dockerfile 需 COPY shared/service-common（JWT 统一实现）
      context: ../
      dockerfile: services/agent-service/Dockerfile
    container_name: kg-dev-agent
    volumes:
      - ../services/agent-service/app:/app/app
      - ../services/agent-service/tests:/app/tests

    command:
      - sh
      - -c
      - "exec uvicorn app.main:app --reload --host 0.0.0.0 --port 8006"
    environment:
      LLM_PROVIDER: openai
      LLM_BASE_URL: http://192.168.124.15:11434/v1
      LLM_MODEL: qwen3:8b
      LLM_API_KEY: ""
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      LOG_FORMAT: ${LOG_FORMAT:-human}
      SESSION_STORE: postgres
      PG_DSN: postgresql://kg:kg@kg-dev-postgres:5432/kg
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      GRAPH_QUERY_URL: http://kg-dev-query:8001
      IMPORT_SERVICE_URL: http://kg-dev-import:8005
      INGESTION_URL: http://kg-dev-ingestion:8003
    depends_on:
      - postgres
    ports:
      - "8006:8006"
    restart: unless-stopped

  # ── 前端（挂载仓库源码 + 容器内装依赖 + vite dev HMR）──
  web:
    image: oven/bun:1.1
    container_name: kg-dev-web
    working_dir: /repo
    volumes:
      - ..:/repo
      # 遮蔽 host 的 node_modules（macOS 原生二进制）→ 容器内装 Linux 版
      - web_node_modules:/repo/node_modules
      # 同理：apps/shell/node_modules 也是 bind mount（host macOS 版 esbuild 等），
      # 必须遮蔽成容器内独立 Linux 版，否则 vite 报 esbuild host/binary 版本不匹配
      - web_shell_node_modules:/repo/apps/shell/node_modules
    command: sh -c "bun install --frozen-lockfile 2>/dev/null || bun install; cd apps/shell && bun dev --host 0.0.0.0"
    environment:
      # 容器内 proxy 目标（指向服务名）
      VITE_PROXY_TARGET: http://kg-dev-query:8001
      VITE_AUTH_PROXY: http://kg-dev-auth:8004
      VITE_INGEST_PROXY: http://kg-dev-ingestion:8003
      VITE_IMPORT_PROXY: http://kg-dev-import:8005
      VITE_AGENT_PROXY: http://kg-dev-agent:8006
      VITE_FILTER_CONFIG_PROXY: http://kg-dev-filter-config:8007
    ports:
      - "3001:3001"
    depends_on:
      - query
      - rule
      - auth
      - opa
      - ingestion
      - import
      - agent
      - filter-config
    restart: unless-stopped

# 复用现有 Neo4j 数据卷（与生产共用，勿同时跑 dev/prod）
volumes:
  neo4j_data:
    name: vite-test_neo4j_data
    external: true
  neo4j_logs:
    name: vite-test_neo4j_logs
    external: true
  neo4j_import:
    name: vite-test_neo4j_import
    external: true
  neo4j_plugins:
    name: vite-test_neo4j_plugins
    external: true
  pg_data:
  web_node_modules:
  web_shell_node_modules:
