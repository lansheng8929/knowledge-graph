services:
  neo4j:
    image: neo4j:5-community
    container_name: knowledge-graph-neo4j
    ports:
      - "7687:7687"   # Bolt
      - "7474:7474"   # HTTP (Browser)
    environment:
      - NEO4J_AUTH=neo4j/password123
      # 堆内存（Neo4j 5.x 推荐配置名）
      - NEO4J_server_memory_heap_max__size=2G
      # 页面缓存
      - NEO4J_server_memory_pagecache_size=1.5G

    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
